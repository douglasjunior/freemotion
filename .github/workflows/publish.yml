# Publishes the package to npm whenever a GitHub release is published.
#
# The version comes from the release tag (`1.2.3` or `v1.2.3`), is written to
# the packages' package.json files before `pnpm publish`, and then committed back
# to the default branch so the repository matches what is on npm.
#
# Authentication uses npm Trusted Publishing (OIDC), so no token is stored in
# GitHub. One-time setup on npmjs.com → package → Settings → Trusted Publisher:
#   Provider: GitHub Actions · Repository: douglasjunior/freemotion
#   Workflow filename: publish.yml · Environment: (leave empty)
#
# The version commit is pushed by the `douglasjunior-bot` GitHub App, which is on
# the bypass list of the ruleset that protects the default branch. The App ID
# and private key live in the RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY secrets.
#
# A release marked as "pre-release" is published under the `next` dist-tag
# instead of `latest`.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }} to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Read the version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! node -e 'process.exit(/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/.test(process.argv[1]) ? 0 : 1)' "$version"; then
            echo "::error::Release tag '$TAG' is not a semver version (expected e.g. 1.2.3 or v1.2.3)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Set the version in the packages
        run: |
          for dir in . packages/freemotion packages/three; do
            npm pkg set "version=${{ steps.version.outputs.version }}" --prefix "$dir"
          done
          npm pkg set "peerDependencies.freemotion=^${{ steps.version.outputs.version }}" --prefix packages/three

      - run: pnpm build

      - name: Publish to npm
        # `prepack` builds dist/ before packing. pnpm turns `workspace:*` into the real version.
        run: pnpm --filter freemotion --filter @freemotion/three publish --no-git-checks --access public --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"

      - name: Read the App's bot user id
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit the version to ${{ github.event.repository.default_branch }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -- package.json packages/freemotion/package.json packages/three/package.json
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          for dir in . packages/freemotion packages/three; do
            npm pkg set "version=$VERSION" --prefix "$dir"
          done
          npm pkg set "peerDependencies.freemotion=^$VERSION" --prefix packages/three
          git add package.json packages/freemotion/package.json packages/three/package.json
          if git diff --cached --quiet; then
            echo "package.json on $BRANCH is already at $VERSION."
          else
            git commit -m "chore(release): $VERSION [skip ci]"
            git push origin "$BRANCH"
          fi
